# How feed rows map to markets on MyBookie. Each game in a leagues-lines reply
# carries its main full-game markets under gameMarketTypes: moneyLine, spread
# (point spread, puck line or run line) and total.

# Feed bettype -> gameMarketTypes key, which outcome to pick, and which feed field is the line.
bettypes:
  ATS:       {market: spread,    pick: team,  line: spread}
  SPREAD:    {market: spread,    pick: team,  line: spread}
  RUNLINE:   {market: spread,    pick: team,  line: spread}
  PUCKLINE:  {market: spread,    pick: team,  line: spread}
  OVER:      {market: total,     pick: over,  line: total}
  UNDER:     {market: total,     pick: under, line: total}
  ML:        {market: moneyLine, pick: team,  line: none}
  MONEYLINE: {market: moneyLine, pick: team,  line: none}

# Only full-game lines for now: halves and quarters are separate MyBookie
# leagues (e.g. "NFL 1st Half"), so "1H ATS" is reported as unsupported.
periods:
  "":   G
  G:    G
  FG:   G
  GAME: G

# Feed league -> MyBookie leagueId of its main game-lines league. Leagues not
# listed here are looked up by name in the site's menu (get-menu), using
# league_names below; books.MyB.leagues in config overrides both.
league_ids:
  NFL: "79"
  NCAAF: "78"
  NHL: "4345"
  MLB: "710"

# Names the menu may use for a feed league. A league not listed is looked up by
# its own name (NBA, CFL, WNBA...).
league_names:
  NCAAF: [NCAA Football, College Football]
  NCAAB: [NCAA Basketball, College Basketball]
