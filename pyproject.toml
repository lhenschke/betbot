[project]
name = "betbot"
version = "0.1.0"
description = "Places value bets from the arbhunterpro feed at soft sportsbooks"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "keyring>=25.0",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
betbot = "betbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["betbot*"]

[tool.setuptools.package-data]
"betbot" = ["matching/aliases/*.yaml", "books/*.yaml", "dashboard/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
